<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>

window.TrelloPowerUp.initialize({

  'card-buttons': function(t, opts) {

    return [{
      text: 'GENERUJ OFERTĘ',
      condition: 'always',

      callback: async function(t) {

        const karta = await t.card('id', 'name');

        const url =
          'TUTAJ_WKLEJ_ADRES_APPS_SCRIPT' +
          '?cardId=' + encodeURIComponent(karta.id);

        window.open(url, '_blank');

        return t.alert({
          message: 'Uruchamiam generowanie oferty'
        });
      }
    }];

  }

});

</script>

</body>
</html>
