<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>

window.TrelloPowerUp.initialize({

  'card-buttons': function(t, options) {

    return [

      /******************************************************
       * OFERTA
       ******************************************************/

      {
        text: 'GENERUJ OFERTĘ',
        condition: 'always',

        callback: async function(t) {

          const karta =
            await t.card('id', 'name');

          const url =
            'https://script.google.com/macros/s/AKfycbwSSi4OnXuwIT-0wKpgiJYqTYHWfD_vB_QiYeSEE6BWNjdBbOFglSEuUMmqKOSiwqE7lw/exec' +
            '?typ=oferta' +
            '&cardId=' +
            encodeURIComponent(karta.id);

          window.open(
            url,
            '_blank'
          );

          return t.alert({
            message:
              'Uruchamiam generowanie oferty'
          });
        }
      },


      /******************************************************
       * SPECYFIKACJA DO FV
       ******************************************************/

      {
        text: 'SPECYFIKACJA DO FV',
        condition: 'always',

        callback: async function(t) {

          const karta =
            await t.card('id', 'name');

          const url =
            'https://script.google.com/macros/s/AKfycbwSSi4OnXuwIT-0wKpgiJYqTYHWfD_vB_QiYeSEE6BWNjdBbOFglSEuUMmqKOSiwqE7lw/exec' +
            '?typ=specyfikacja' +
            '&cardId=' +
            encodeURIComponent(karta.id);

          window.open(
            url,
            '_blank'
          );

          return t.alert({
            message:
              'Tworzę specyfikację do FV'
          });
        }
      },


      /******************************************************
       * WZ
       ******************************************************/

      {
        text: 'GENERUJ WZ',
        condition: 'always',

        callback: async function(t) {

          const karta =
            await t.card('id', 'name');

          const url =
            'https://script.google.com/macros/s/AKfycbwSSi4OnXuwIT-0wKpgiJYqTYHWfD_vB_QiYeSEE6BWNjdBbOFglSEuUMmqKOSiwqE7lw/exec' +
            '?typ=wz' +
            '&cardId=' +
            encodeURIComponent(karta.id);

          window.open(
            url,
            '_blank'
          );

          return t.alert({
            message:
              'Tworzę dokument WZ'
          });
        }
      }

    ];

  }

});

</script>

</body>
</html>
