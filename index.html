<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>

<script>
window.TrelloPowerUp.initialize({

  'card-buttons': function(t, options) {

    return [{
      text: 'GENERUJ OFERTĘ',
      condition: 'edit',

      callback: async function(t) {

        const karta = await t.card('id', 'name');

        const url =
          'https://script.google.com/macros/s/AKfycbwdMp4QG0twEG9wY0Un7phE4FH8p5Quah6engjno74yzUZNNlW2KukzmB17QJJsNGE1Ug/exec' +
          '?cardId=' + encodeURIComponent(karta.id);

        window.open(url, '_blank');

        return t.alert({
          message: 'Uruchamiam generowanie oferty'
        });
      }
    }];

  }

});
</script>

</body>
</html>
